# Persisted evaluation set: free surface_brightness (6 discrete points), everything
# else fixed. See injection_grid.yaml for a full explanation of each field; this
# file only calls out what's different for evaluation.
#
# Decision 7 (build prompt): eval isolates ONE free parameter at a time so
# completeness/purity can be plotted as a function of that parameter alone —
# hence orientation is fixed here (unlike injection_grid.yaml, where it's free
# for training diversity) and only richness varies.

morphology: uniform

# Free over 6 discrete surface-brightness points -> build_eval_grid() enumerates
# exactly these 6 values (one eval sample per point, per decision 7).
richness: {surface_brightness: {values: [26.0, 27.2, 28.4, 29.6, 30.8, 32.0]}}

width: 0.2
length: 8.0
distance_modulus: 17.5
age: 12.0
z: 0.0004
orientation: 90.0                 # fixed for eval — only richness is free (decision 7: isolate one parameter at a time)
position: uniform_in_footprint
background_fraction: 0.0

label: {policy: density, normalization: max, dilate_to_width: true}

persist: true   # eval samples ARE persisted (SimulationStore) so every run evaluates on the same
                 # fixed set — unlike training, which draws fresh samples on-the-fly each time.
