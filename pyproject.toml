[project]
name = "streamgoggles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MatthieuPe", email = "matthieupelissier01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "healpy>=1.20.0",
    "hyrax>=0.12",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build]
packages = [{include = "streamgoggles", from = "src"}]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-emoji>=0.2.0",
]

[tool.pytest.ini_options]
addopts = ["--verbose", "--emoji", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "config: config.py (StreamConfig/BackgroundConfig/MatchedFilterConfig, eval grid)",
    "storage: storage.py (ParameterStore, SimulationStore, BackgroundMapStore, ModelStore)",
    "matched_filter: matched_filter.py (matched filter, pixelization, projection)",
]
