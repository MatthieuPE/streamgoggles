[project]
name = "streamgoggles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MatthieuPe", email = "matthieupelissier01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "healpy>=1.20.0",
    "hyrax>=0.12",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build]
packages = [{include = "streamgoggles", from = "src"}]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-emoji>=0.2.0",
]

[tool.pytest.ini_options]
addopts = ["--verbose", "--emoji", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "config: config.py (StreamConfig/BackgroundConfig/MatchedFilterConfig, eval grid)",
    "storage: storage.py (ParameterStore, SimulationStore, BackgroundMapStore, ModelStore)",
    "matched_filter: matched_filter.py (matched filter, pixelization, projection)",
    "windows: windows.py (Window, random/stream window sampling, tile_footprint)",
    "background_sources: background_sources.py (StudyRegion, BackgroundSource implementations, harmonize_columns)",
    "stream_sources: stream_sources.py (StreamObsSource, ExternalSimSource stub)",
    "background: background.py (Background.load_or_cache, build_raw_background_maps)",
    "data_preparation: data_preparation.py (Cut, apply_cuts, apply_magnitude_clipping, dust correction)",
    "injector: injector.py (StreamInjector, inject_background_only, resolve_richness_to_nstars, place_stream_in_footprint)",
    "inject_utils: inject_utils.py (richness conversions: N/mass/surface_brightness/luminosity)",
    "rasterize: rasterize.py (rasterize_binary, rasterize_density, rasterize dispatcher, soft_distance stub)",
    "datasets: datasets/stream_map_dataset.py (StreamMapDataset training/eval modes)",
    "models: models/unet.py (UNet architecture, forward/encoder, head types)",
]
