name: docs

on:
  pull_request:
    paths:
      - "src/streamgoggles/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "src/streamgoggles/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Deliberately lean install -- NOT `uv sync` (which pulls this project's
# full dependency graph; `hyrax` alone drags in mlflow/chromadb/onnxruntime
# and more just to get torch, several minutes even cached, confirmed by
# watching a real run). A docs build only needs sphinx + its plugins, plus
# whichever streamgoggles modules' own imports autodoc actually needs to
# read their docstrings -- so this installs exactly that: the "docs"
# dependency group, and numpy/pandas/healpy/pyyaml (small, fast, already
# direct project dependencies). `docs/source/conf.py`'s
# STREAMGOGGLES_DOCS_LEAN branch (set below) mocks the rest
# (torch/streamobs/ugali/gala/astropy/scipy/matplotlib/hyrax) instead of
# installing them -- both because they're the genuinely expensive/slow
# ones, and because streamobs/ugali need real external survey/isochrone
# data for anything beyond a bare import, which this workflow has no
# reason to set up just to read docstrings.
#
# Real, accepted gap from mocking rather than installing: two API pages
# (models.losses, training.plain_runner) use a bare `torch.Tensor | None`
# parameter annotation that Sphinx's mock objects can't evaluate (no `|`
# support), so those two end up empty in CI -- confirmed for real, not
# assumed, and not worth installing torch just to fix (both modules are
# already described in the narrative "Datasets and models"/"Training and
# evaluation" guide pages). Every other page -- the full narrative guide,
# and the other ~18 modules' API reference -- builds completely.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --group docs numpy pandas healpy pyyaml
          uv pip install --no-deps -e .

      - name: Build docs
        env:
          STREAMGOGGLES_DOCS_LEAN: "1"
        run: .venv/bin/sphinx-build -b html docs/source docs/_build/html

      - name: Upload build artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
