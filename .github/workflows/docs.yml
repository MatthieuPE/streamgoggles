name: docs

on:
  pull_request:
    paths:
      - "src/streamgoggles/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "src/streamgoggles/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Sphinx autodoc imports every streamgoggles module to read its docstrings,
# so a *complete* build needs the full runtime (torch, healpy, ugali,
# streamobs+gala), not just the "docs" dependency group. `pyproject.toml`
# doesn't declare `ugali`/`streamobs` as installable dependencies (a known,
# already-flagged gap -- see PLAN.md's "pyproject.toml should eventually be
# brought in line with reality" note), and both need real external survey/
# isochrone data for anything beyond a bare import -- deliberately NOT
# installed here (they'd need that data in CI too, which this workflow is
# not meant to set up; see PLAN.md's decision log for this file).
#
# Deliberate tradeoff instead: `uv sync --group docs` alone (torch/astropy/
# scipy come along transitively via the `hyrax` dependency; healpy/numpy/
# pandas are direct dependencies), and no `-W` (warnings-as-errors) on the
# build. Modules that need streamobs/ugali/gala directly (background.py,
# background_sources.py, data_preparation.py, datasets/stream_map_dataset.py,
# inject_utils.py, injector.py, stream_sources.py -- 7 of ~20 API pages,
# confirmed for real by actually building with those three absent, not
# assumed) fail to import under autodoc and end up with an empty API
# reference page each. sphinx's own behavior on an autodoc import failure
# is a WARNING, not a hard failure, so the build still exits 0 and every
# other page (the full narrative guide, and the other ~13 modules' API
# reference) is complete. The narrative pages describe all of those modules
# anyway (see the Guide section), so this is a real but acceptable gap, not
# a broken site.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build docs
        run: uv run sphinx-build -b html docs/source docs/_build/html

      - name: Upload build artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
